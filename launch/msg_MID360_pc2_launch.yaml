# Launch file to load livox_ros_driver2 and livox_to_pointcloud2 as components into a component_container
launch:
  - arg:
      name: compressing
      default: "true"

  - node_container:
      pkg: rclcpp_components
      exec: component_container
      name: livox_driver_container
      namespace: ''
      composable_node:
        # The actual lidar driver
        - pkg: livox_ros_driver2
          plugin: livox_ros::DriverNode
          name: livox_ros_driver2
          param:
            - name: user_config_path
              value: '$(var user_config_path)'
            - name: xfer_format
              value: 1  # custom livox format as used in Fast-lio
            - name: multi_topic
              value: 1
            - name: publish_freq
              value: '$(var publish_freq)'
            - name: custom_pc2_intensity_field
              value: 'intensity'
            - name: custom_pc2_tag_field
              value: 'tag'
            - name: custom_pc2_ring_field
              value: 'ring'
            - name: custom_pc2_time_field
              value: 't'
        # Convert the custom livox format to PointCloud2      
        - pkg: livox_to_pointcloud2
          plugin: livox_to_pointcloud2::LivoxToPointCloud2
          name: livox_to_pointcloud2
          param:
            - name: input_topics
              value: '$(var input_topics_pc2)'
            - name: output_topics
              value: '$(var output_topics_pc2)'
        # Compress the PointCloud2 messages using cloudini_ros      
        - pkg: "cloudini_ros"
          plugin: "CloudiniPointcloudConverterMulti"
          name: "livox_driver_cloudini_converter"
          param:
            - name: "compressing"
              value: "$(var compressing)"
            - name: "topics_input"
              value: $(var input_topics_cloudini)
            - name: "topics_output"
              value: $(var output_topics_cloudini)
            - name: "resolution"
              value: "$(var pc_resolution)"
          extra_arg:
            - name: "use_intra_process_comms"
              value: "true"
